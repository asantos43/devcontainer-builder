appId: dev.devcontainer.builder
productName: DevContainer Builder
directories:
  output: release
files:
  - out/**/*
  - package.json
  - LICENSE
  - build/icon.png
asar: true
asarUnpack:
  - node_modules/@devcontainers/cli/**/*
  - node_modules/node-pty/**/*
npmRebuild: false
artifactName: '${name}-${version}-${os}-${arch}.${ext}'
linux:
  target: [AppImage, deb, rpm]
  category: Development
  syncDesktopName: true
  maintainer: Anderson Santos <asantos43@users.noreply.github.com>
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libgbm1
    - libasound2 | libasound2t64
    - libatk-bridge2.0-0 | libatk-bridge2.0-0t64
    - libdrm2
    - libxkbcommon0
    - libx11-6
    - libxcomposite1
    - libxdamage1
    - libxrandr2
    - libc6 (>= 2.31)

rpm:
  # Shared-library capabilities avoid distribution-specific RPM package names.
  depends:
    - glibc >= 2.31
    - xdg-utils
    - libX11.so.6()(64bit)
    - libXcomposite.so.1()(64bit)
    - libXdamage.so.1()(64bit)
    - libXext.so.6()(64bit)
    - libXfixes.so.3()(64bit)
    - libXrandr.so.2()(64bit)
    - libXss.so.1()(64bit)
    - libXtst.so.6()(64bit)
    - libasound.so.2()(64bit)
    - libatk-1.0.so.0()(64bit)
    - libatk-bridge-2.0.so.0()(64bit)
    - libatspi.so.0()(64bit)
    - libcairo.so.2()(64bit)
    - libcups.so.2()(64bit)
    - libdbus-1.so.3()(64bit)
    - libexpat.so.1()(64bit)
    - libgbm.so.1()(64bit)
    - libgcc_s.so.1()(64bit)
    - libgio-2.0.so.0()(64bit)
    - libglib-2.0.so.0()(64bit)
    - libgobject-2.0.so.0()(64bit)
    - libgtk-3.so.0()(64bit)
    - libnotify.so.4()(64bit)
    - libnspr4.so()(64bit)
    - libnss3.so()(64bit)
    - libnssutil3.so()(64bit)
    - libpango-1.0.so.0()(64bit)
    - libsmime3.so()(64bit)
    - libudev.so.1()(64bit)
    - libuuid.so.1()(64bit)
    - libxcb.so.1()(64bit)
    - libxkbcommon.so.0()(64bit)

win:
  target: [nsis]
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0.0'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

publish:
  provider: github
  owner: asantos43
  repo: devcontainer-builder
  private: false
  releaseType: draft
