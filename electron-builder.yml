appId: dev.devcontainer.builder
productName: DevContainer Builder
directories:
  output: release
files:
  - out/**/*
  - package.json
  - LICENSE
  - build/icon.png
asar: true
asarUnpack:
  - node_modules/@devcontainers/cli/**/*
  - node_modules/node-pty/**/*
npmRebuild: false
artifactName: '${name}-${version}-${os}-${arch}.${ext}'
linux:
  target: [AppImage, deb]
  category: Development
  syncDesktopName: true
  maintainer: Anderson Santos <asantos43@users.noreply.github.com>
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libgbm1
    - libasound2 | libasound2t64
    - libatk-bridge2.0-0 | libatk-bridge2.0-0t64
    - libdrm2
    - libxkbcommon0
    - libx11-6
    - libxcomposite1
    - libxdamage1
    - libxrandr2
    - libc6 (>= 2.31)

win:
  target: [nsis]
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0.0'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

publish:
  provider: github
  owner: asantos43
  repo: devcontainer-builder
  private: true
  releaseType: draft
